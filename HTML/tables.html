<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>
    <style>
        table,tr,td,th{
            border:3px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <h3>HTML Table</h3>
    <table>
        <tr>
            <th>Nitin</th>
            <th>Vishal</th>
            <th>Abhishek</th>

        </tr>
        <tr>
            <td>Nitin</td>
            <td>Himanshu</td>
            <td>Anjali</td>
        </tr>
        <tr>
            <td>Vishal</td>
            <td>Hridyanshu</td>                                                                                                
            <td>Nitika</td>
        </tr>
    </table>
</body>
</html>
