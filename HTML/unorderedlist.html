<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List</title>
</head>
<body>
    <h1>Unordered List</h1>
    <!-- unordered list -->
     <h2>unordered list</h2>
     <ul type="square">
        <li>Apple</li>
        <li>Mango</li>
        <li>Orange</li>
        <li>Coconet</li>
     </ul>
     <h2>unordered list</h2>
     <ul type="circle">
        <li>Apple</li>
        <li>Mango</li>
        <li>Orange</li>
        <li>Coconet</li>
     </ul>
     <h2>unordered list</h2>
     <ul>
        <li>Apple</li>
        <li>Mango</li>
        <li>Orange</li>
        <li>Coconet</li>
     </ul>
     <h2>unordered list</h2>
     <ul type="disc">
        <li>Apple</li>
        <li>Mango</li>
        <li>Orange</li>
        <li>Coconet</li>
     </ul>
</body>
</html>
