<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Table</title>
    <style>
        table,th,tr,td{
            border:2px solid black;
            border-collapse: collapse;
            width: 350px;
        }
    </style>
</head>
<body>
    <table>
    <tr>
        <th rowspan="2"></th>
        <th colspan="2">Average</th>
        <th rowspan="2">Red eyes</th>
    </tr>
    <tr>
        <th>Height</th>
        <th>weight</th>
    </tr>
    <tr>
        <th>Males</th>
        <td>1.9</td>
        <td>0.003</td>
        <td>40%</td>
    </tr>
    <tr>
        <th>Female</th>
        <td>1.7</td>
        <td>0.002</td>
        <td>43%</td>
    </tr>
    <caption><i>A text table with merged cells </i></caption>
    </table>
</body>
</html>
